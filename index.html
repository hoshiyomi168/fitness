<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新手 PPL 健身紀錄</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #666;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #DDD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .exercise-block {
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .exercise-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #2C3E50;
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .inputs-grid input {
      font-size: 0.9rem;
      padding: 8px;
    }
    button.btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    button.btn-submit:active {
      opacity: 0.9;
    }
    .log-item {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary);
      border-bottom: 1px solid #EEE;
      padding-bottom: 6px;
    }
    .log-detail-line {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 4px;
    }
    .delete-btn {
      position: absolute;
      right: 10px;
      top: 10px;
      background: none;
      border: none;
      color: #FF4D4F;
      font-size: 1rem;
      cursor: pointer;
      width: auto;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

  <h1>🏋️‍♂️ PPL 健身菜單紀錄</h1>

  <!-- 新增紀錄表單 -->
  <div class="card">
    <div class="form-group">
      <label for="date">日期</label>
      <input type="date" id="date">
    </div>

    <div class="form-group">
      <label for="workoutRoutine">選擇今日菜單</label>
      <select id="workoutRoutine" onchange="renderExerciseForm()">
        <option value="Push">推日 (Push)</option>
        <option value="Pull">拉日 (Pull)</option>
        <option value="Leg">腿日 (Leg)</option>
      </select>
    </div>

    <!-- 動態生成動作填寫區 -->
    <div id="exerciseFormContainer"></div>

    <button class="btn-submit" onclick="addLog()">儲存今日訓練</button>
  </div>

  <!-- 歷史紀錄顯示區 -->
  <h2>📋 歷史紀錄</h2>
  <div id="logList"></div>

  <script>
    // 菜單與對應器材設定
    const routines = {
      'Push': { name: '推日 (Push)', exercises: ['坐姿胸推機', '坐姿肩推機', '夾胸機', '三頭下壓'] },
      'Pull': { name: '拉日 (Pull)', exercises: ['滑輪下拉', '坐姿水平划船', '反向飛鳥機', '二頭彎舉機'] },
      'Leg':  { name: '腿日 (Leg)',  exercises: ['腿推機', '坐姿腿伸展機', '坐姿腿屈體機', '坐姿外展肌機'] }
    };

    // 初始化預設今天日期
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // 動態生成該菜單的動作表單
    function renderExerciseForm() {
      const routineKey = document.getElementById('workoutRoutine').value;
      const exercises = routines[routineKey].exercises;
      const container = document.getElementById('exerciseFormContainer');
      container.innerHTML = '';

      exercises.forEach((ex, index) => {
        const div = document.createElement('div');
        div.className = 'exercise-block';
        div.innerHTML = `
          <div class="exercise-title">${index + 1}. ${ex}</div>
          <div class="inputs-grid">
            <div>
              <label>重量 (kg)</label>
              <input type="number" class="input-weight" data-name="${ex}" placeholder="0" step="2.5">
            </div>
            <div>
              <label>組數</label>
              <input type="number" class="input-sets" placeholder="0">
            </div>
            <div>
              <label>次數/組</label>
              <input type="number" class="input-reps" placeholder="0">
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // 儲存紀錄至 localStorage
    function addLog() {
      const date = document.getElementById('date').value;
      const routineKey = document.getElementById('workoutRoutine').value;
      const routineName = routines[routineKey].name;

      const blocks = document.querySelectorAll('.exercise-block');
      const items = [];

      blocks.forEach(block => {
        const name = block.querySelector('.input-weight').dataset.name;
        const weight = block.querySelector('.input-weight').value || 0;
        const sets = block.querySelector('.input-sets').value || 0;
        const reps = block.querySelector('.input-reps').value || 0;

        // 只儲存有填寫重量或組數的項目
        if (weight > 0 || sets > 0) {
          items.push({ name, weight, sets, reps });
        }
      });

      if (items.length === 0) {
        alert('請至少填寫一項器材的訓練數據！');
        return;
      }

      const newRecord = {
        id: Date.now(),
        date,
        routineName,
        items
      };

      const logs = JSON.parse(localStorage.getItem('pplFitnessLogs') || '[]');
      logs.unshift(newRecord);
      localStorage.setItem('pplFitnessLogs', JSON.stringify(logs));

      renderLogs();
      alert('訓練紀錄已成功儲存！');
    }

    // 渲染歷史紀錄
    function renderLogs() {
      const logList = document.getElementById('logList');
      logList.innerHTML = '';
      const logs = JSON.parse(localStorage.getItem('pplFitnessLogs') || '[]');

      if (logs.length === 0) {
        logList.innerHTML = '<p
